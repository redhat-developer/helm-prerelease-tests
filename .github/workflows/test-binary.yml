name: Helm Binary Tests

on:
  workflow_dispatch:
    inputs:
      image_sha:
        description: 'Konflux image to test (overrides image.env)'
        required: false
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  extract:
    name: Extract binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image reference
        id: image
        run: |
          if [[ -n "${{ github.event.inputs.image_sha }}" ]]; then
            echo "ref=${{ github.event.inputs.image_sha }}" >> "$GITHUB_OUTPUT"
          else
            source image.env
            echo "ref=${BINARY_IMAGE}" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull image and extract all binaries
        run: |
          mkdir -p binaries
          docker create --name extract --platform linux/amd64 "${{ steps.image.outputs.ref }}"
          docker cp extract:/releases/. binaries/
          docker rm extract
          ls -lh binaries/

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: helm-binaries
          path: binaries/
          retention-days: 1

  test:
    needs: extract
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-amd64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: macos-15
            platform: darwin-amd64
          - os: macos-latest
            platform: darwin-arm64
          - os: windows-latest
            platform: windows-amd64
          - os: windows-11-arm
            platform: windows-arm64

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.platform }}
    env:
      HELM_PLATFORM: ${{ matrix.platform }}
      VERBOSE: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: helm-binaries
          path: helm-binary-test/

      - name: Remove quarantine (macOS)
        if: runner.os == 'macOS'
        run: xattr -dr com.apple.quarantine helm-binary-test/ 2>/dev/null || true

      - name: Make binaries executable
        if: runner.os != 'Windows'
        run: chmod +x helm-binary-test/helm-*

      - name: Create kind cluster
        if: runner.os == 'Linux'
        uses: helm/kind-action@v1
        with:
          cluster_name: helm-test

      - name: Create results directory
        shell: bash
        run: mkdir -p test-results/verbose

      - name: non-cluster / 01-validation
        shell: bash
        working-directory: helm-binary-test
        run: bash ../scripts/binary/non-cluster/01-validation.sh 2>&1 | tee ../test-results/verbose/nc-01-validation.log

      - name: non-cluster / 02-smoke
        shell: bash
        working-directory: helm-binary-test
        run: bash ../scripts/binary/non-cluster/02-smoke.sh 2>&1 | tee ../test-results/verbose/nc-02-smoke.log

      - name: non-cluster / 03-dependencies
        shell: bash
        working-directory: helm-binary-test
        run: bash ../scripts/binary/non-cluster/03-dependencies.sh 2>&1 | tee ../test-results/verbose/nc-03-dependencies.log

      - name: non-cluster / 04-functionality
        shell: bash
        working-directory: helm-binary-test
        run: bash ../scripts/binary/non-cluster/04-functionality.sh 2>&1 | tee ../test-results/verbose/nc-04-functionality.log

      - name: non-cluster / 05-v4-features
        shell: bash
        working-directory: helm-binary-test
        run: bash ../scripts/binary/non-cluster/05-v4-features.sh 2>&1 | tee ../test-results/verbose/nc-05-v4-features.log

      - name: non-cluster / 06-distribution
        shell: bash
        working-directory: helm-binary-test
        run: bash ../scripts/binary/non-cluster/06-distribution.sh 2>&1 | tee ../test-results/verbose/nc-06-distribution.log

      - name: cluster / 01-functionality
        shell: bash
        working-directory: helm-binary-test
        run: bash ../scripts/binary/cluster/01-functionality.sh 2>&1 | tee ../test-results/verbose/cl-01-functionality.log

      - name: cluster / 02-oci
        shell: bash
        working-directory: helm-binary-test
        run: bash ../scripts/binary/cluster/02-oci.sh 2>&1 | tee ../test-results/verbose/cl-02-oci.log

      - name: cluster / 03-v4-features
        shell: bash
        working-directory: helm-binary-test
        run: bash ../scripts/binary/cluster/03-v4-features.sh 2>&1 | tee ../test-results/verbose/cl-03-v4-features.log

      - name: Generate summary report
        if: always()
        shell: bash
        run: |
          echo "# Test Results — ${{ matrix.platform }}" > test-results/summary.txt
          echo "" >> test-results/summary.txt
          for log in test-results/verbose/*.log; do
            grep -E "^(PASS:|FAIL:|SKIP:|SKIP ALL:|TOTAL:|===)" "$log" >> test-results/summary.txt 2>/dev/null || true
            echo "" >> test-results/summary.txt
          done

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.platform }}
          path: test-results/
          retention-days: 30
