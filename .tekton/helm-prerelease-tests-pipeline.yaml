---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: helm-prerelease-tests
spec:
  params:
    - name: SNAPSHOT
      type: string
      description: Konflux application snapshot (auto-injected)
  tasks:
    - name: prerelease-tests
      params:
        - name: SNAPSHOT
          value: $(params.SNAPSHOT)
      taskSpec:
        params:
          - name: SNAPSHOT
            type: string
        results:
          - name: TEST_OUTPUT
            description: Test results in Konflux format
        volumes:
          - name: shared
            emptyDir: {}
        steps:
          - name: clone-test-repo
            image: registry.access.redhat.com/ubi9/ubi-minimal:latest
            volumeMounts:
              - name: shared
                mountPath: /shared
            script: |
              #!/usr/bin/env bash
              set -euo pipefail
              microdnf install -y git-core tar gzip
              git clone --depth 1 https://github.com/redhat-developer/helm-prerelease-tests.git /shared/tests
              echo "Cloned test repo at $(cd /shared/tests && git rev-parse --short HEAD)"

          - name: extract-binaries
            image: registry.redhat.io/openshift4/ose-cli-rhel9:v4.19
            volumeMounts:
              - name: shared
                mountPath: /shared
            script: |
              #!/usr/bin/env bash
              set -euo pipefail

              IMAGE=$(python3 -c "
              import json, sys
              snap = json.loads(sys.argv[1])
              for c in snap.get('components', []):
                  if c.get('name') == 'helm-cli':
                      print(c['containerImage'])
                      sys.exit(0)
              print('ERROR: helm-cli component not found', file=sys.stderr)
              print(json.dumps(snap, indent=2), file=sys.stderr)
              sys.exit(1)
              " '$(params.SNAPSHOT)')

              if [[ -z "$IMAGE" ]]; then
                exit 1
              fi

              echo "Extracting from: ${IMAGE}"
              mkdir -p /shared/binaries

              oc image extract "$IMAGE" \
                --path /releases/:/shared/binaries/ \
                --filter-by-os linux/amd64

              echo ""
              echo "Extracted files:"
              ls -lh /shared/binaries/

          - name: run-tests
            image: registry.access.redhat.com/ubi9/ubi:latest
            workingDir: /shared/binaries
            volumeMounts:
              - name: shared
                mountPath: /shared
            env:
              - name: HELM_PLATFORM
                value: linux-amd64
              - name: VERBOSE
                value: "1"
            script: |
              #!/usr/bin/env bash
              set -uo pipefail

              SCRIPTS="/shared/tests/scripts"
              RESULTS_DIR="/shared/test-results"
              mkdir -p "$RESULTS_DIR"

              TOTAL_PASS=0
              TOTAL_FAIL=0
              TOTAL_SKIP=0
              FAILED_SUITES=()

              for script in \
                "$SCRIPTS"/01-validation.sh \
                "$SCRIPTS"/02-smoke.sh \
                "$SCRIPTS"/03-dependencies.sh \
                "$SCRIPTS"/04-functionality-offline.sh \
                "$SCRIPTS"/05-functionality-cluster.sh \
                "$SCRIPTS"/06-oci.sh \
                "$SCRIPTS"/07-v4-features-offline.sh \
                "$SCRIPTS"/08-v4-features-cluster.sh \
                "$SCRIPTS"/09-distribution.sh; do

                suite="$(basename "$script" .sh)"
                echo ""
                echo "================================================================"
                echo "Running: ${suite}"
                echo "================================================================"

                bash "$script" 2>&1 | tee "$RESULTS_DIR/${suite}.log"
                rc=${PIPESTATUS[0]}

                totals=$(grep -E '^TOTAL:' "$RESULTS_DIR/${suite}.log" || true)
                if [[ -n "$totals" ]]; then
                  p=$(echo "$totals" | grep -oP 'PASS: \K[0-9]+' || echo 0)
                  f=$(echo "$totals" | grep -oP 'FAIL: \K[0-9]+' || echo 0)
                  s=$(echo "$totals" | grep -oP 'SKIP: \K[0-9]+' || echo 0)
                  TOTAL_PASS=$((TOTAL_PASS + p))
                  TOTAL_FAIL=$((TOTAL_FAIL + f))
                  TOTAL_SKIP=$((TOTAL_SKIP + s))
                fi

                if [[ $rc -ne 0 ]]; then
                  FAILED_SUITES+=("$suite")
                fi
              done

              echo ""
              echo "================================================================"
              echo "OVERALL RESULTS"
              echo "================================================================"
              echo "PASS: ${TOTAL_PASS}  FAIL: ${TOTAL_FAIL}  SKIP: ${TOTAL_SKIP}"
              if [[ ${#FAILED_SUITES[@]} -gt 0 ]]; then
                echo "FAILED SUITES:"
                for s in "${FAILED_SUITES[@]}"; do
                  echo "  - ${s}"
                done
              fi

              if [[ $TOTAL_FAIL -eq 0 ]]; then
                RESULT="SUCCESS"
                NOTE="All suites passed (${TOTAL_PASS} tests, ${TOTAL_SKIP} skipped)"
              else
                NOTE="Failed suites: $(IFS=', '; echo "${FAILED_SUITES[*]}")"
                RESULT="FAILURE"
              fi

              TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
              printf '{"result":"%s","timestamp":"%s","successes":%d,"failures":%d,"warnings":0,"note":"%s"}' \
                "$RESULT" "$TIMESTAMP" "$TOTAL_PASS" "$TOTAL_FAIL" "$NOTE" \
                > "$(results.TEST_OUTPUT.path)"

              echo ""
              echo "TEST_OUTPUT: ${RESULT}"

              [[ $TOTAL_FAIL -eq 0 ]]
